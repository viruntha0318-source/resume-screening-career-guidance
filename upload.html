<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Resume</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f7f1ff,
                    #edf5ff
                );

            color: #302844;
        }

        .card {
            width: min(620px, 90%);

            padding: 32px;

            background: white;

            border-radius: 24px;

            border: 1px solid #e4dcef;

            box-shadow:
                0 20px 50px
                rgba(70,50,100,0.12);
        }

        h1 {
            color: #4b386b;
            margin-top: 0;
        }

        p {
            color: #756b84;
        }

        input {
            width: 100%;
            margin: 12px 0;
            padding: 13px;

            border-radius: 12px;

            border: 1px solid #ddd5e9;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: #5b437f;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>
        Resume Upload
    </h1>

    <p>
        Upload your resume to continue.
    </p>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="text"
            name="name"
            placeholder="Name"
            required
        >

        <input
            type="text"
            name="register_number"
            placeholder="Register Number"
            required
        >

        <input
            type="text"
            name="company"
            placeholder="Target Company"
            required
        >

        <input
            type="file"
            name="resume"
            accept=".pdf,.docx,.txt,.rtf,.jpg,.jpeg,.png,.webp"
            required
        >

        <button type="submit">
            ANALYZE RESUME
        </button>

    </form>

</div>

</body>
</html>
